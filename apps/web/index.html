<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-mascot" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="spartan-icon spartan-icon--large">
          <use href="#spartan-head"></use>
        </svg>
      </div>
      <h1 class="login-title">Loop</h1>
      <p id="login-subtitle" class="login-subtitle">Sign in with email</p>
      <form id="email-form" novalidate>
        <input
          id="login-email"
          class="login-input login-input--email"
          type="email"
          autocomplete="email"
          placeholder="Email"
          aria-label="Email"
        />
        <button type="submit" class="btn btn-primary login-btn">Continue</button>
      </form>
      <form id="code-form" autocomplete="off" novalidate hidden>
        <input
          id="login-code"
          class="login-input"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="••••••"
          aria-label="Code"
        />
        <button type="submit" class="btn btn-primary login-btn">Sign in</button>
        <button type="button" id="code-back" class="btn btn-ghost-dark login-btn">Back</button>
      </form>
      <div id="protect-check" class="protect-check" hidden></div>
      <p id="login-error" class="login-error" hidden></p>
      <p class="login-credit">made by startup club</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <svg viewBox="0 0 64 64" class="spartan-icon" aria-hidden="true">
          <use href="#spartan-head"></use>
        </svg>
        <span class="topbar-brand">Loop</span>
      </div>
      <nav class="topbar-tabs" aria-label="Categories">
        <button class="tab-btn active" data-category="all">All</button>
        <button class="tab-btn" data-category="food">Food</button>
        <button class="tab-btn" data-category="assignments">School Assignments</button>
        <button class="tab-btn" data-category="clothes">Clothes</button>
        <button class="tab-btn" data-category="jobs">Jobs</button>
        <button class="tab-btn" data-category="other">Other</button>
      </nav>
      <div class="topbar-right">
        <span id="user-id-badge" class="user-badge"></span>
        <button id="logout-btn" class="btn btn-ghost">Log out</button>
      </div>
    </header>

    <main class="content">
      <div class="layout">
        <aside class="sidebar">
          <h3 class="sidebar-title">Sort &amp; Filter</h3>
          <div class="filter-group">
            <label class="filter-label">Sort by</label>
            <div class="filter-options" id="sort-options">
              <button class="filter-btn active" data-sort="featured">Featured</button>
              <button class="filter-btn" data-sort="cheapest">Cheapest</button>
              <button class="filter-btn" data-sort="expensive">Most Expensive</button>
              <button class="filter-btn" data-sort="newest">Newest</button>
              <button class="filter-btn" data-sort="az">Name A–Z</button>
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">Max price</label>
            <input
              type="range"
              id="price-range"
              class="price-range"
              min="0"
              max="100"
              step="5"
              value="100"
            />
            <div class="price-range-value">Up to $<span id="price-range-label">100+</span></div>
          </div>
        </aside>

        <div class="main-col">
          <section class="hero">
            <div class="hero-row">
              <div>
                <h2>Browse the marketplace</h2>
                <p>Food, assignments, clothes, services and more — from fellow DLS students.</p>
              </div>
              <button id="create-listing-btn" class="btn btn-primary">+ Create Product</button>
            </div>
          </section>

          <div id="listing-grid" class="listing-grid"></div>

          <p id="empty-state" class="empty-state" hidden>No listings match your filters.</p>
        </div>
      </div>
    </main>

    <footer class="footer">made by startup club</footer>
  </div>

  <!-- Create / edit product modal -->
  <div id="create-modal" class="modal-overlay" hidden>
    <div class="modal modal--editor" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
      <div class="modal-header">
        <h3 id="create-modal-title">Create Product</h3>
        <button id="create-modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="create-form" class="editor-layout" autocomplete="off">
        <div class="editor-form">
          <div class="editor-section">
            <span class="field-label">Photos <span class="field-hint">(up to 5)</span></span>
            <div id="photo-thumbs" class="photo-thumbs"></div>
            <div class="photo-actions">
              <label class="photo-add-btn">
                + Add photos
                <input id="create-image-files" type="file" accept="image/*" multiple />
              </label>
            </div>
          </div>

          <label class="field">
            <span class="field-label">Product name</span>
            <input id="create-title" type="text" minlength="3" maxlength="80" required placeholder="e.g. Homemade cookies" />
          </label>
          <label class="field">
            <span class="field-label">Description</span>
            <textarea id="create-desc" rows="3" maxlength="2000" placeholder="Short description"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span class="field-label">Price ($)</span>
              <input id="create-price" type="number" min="0.01" max="10000" step="0.01" required placeholder="10" />
            </label>
            <label class="field">
              <span class="field-label">Category</span>
              <select id="create-category" required>
                <option value="food">Food</option>
                <option value="assignments">School Assignments</option>
                <option value="clothes">Clothes</option>
                <option value="jobs">Jobs</option>
                <option value="other">Other</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span class="field-label">Seller name or brand</span>
            <input id="create-seller-name" type="text" maxlength="50" required placeholder="Real name or what you go by" />
          </label>
          <p id="create-error" class="login-error" hidden></p>
          <div class="editor-actions">
            <button type="button" id="create-cancel" class="btn btn-ghost-dark">Cancel</button>
            <button type="submit" class="btn btn-primary create-submit">Add to marketplace</button>
          </div>
        </div>

        <div class="editor-preview">
          <span class="preview-label">Live preview</span>
          <div id="live-preview" class="listing-card preview-card" aria-hidden="true"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- Spartan head symbol -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="spartan-head" viewBox="0 0 64 64">
      <!-- crest -->
      <path d="M32 4c6 0 11 3 14 8l-4 2c-2-3-6-5-10-5s-8 2-10 5l-4-2c3-5 8-8 14-8z" fill="#c0c0c0"/>
      <!-- helmet dome -->
      <path d="M18 34c0-9 6-16 14-16s14 7 14 16v6c0 4-1 7-4 10l-3-2c2-2 3-5 3-8v-6c0-7-4-12-10-12s-10 5-10 12v6c0 3 1 6 3 8l-3 2c-3-3-4-6-4-10v-6z" fill="#e8e8e8"/>
      <!-- cheek guards -->
      <path d="M20 36v8c0 5 2 9 6 12l2-4c-3-2-4-5-4-9v-7z" fill="#d0d0d0"/>
      <path d="M44 36v8c0 5-2 9-6 12l-2-4c3-2 4-5 4-9v-7z" fill="#d0d0d0"/>
      <!-- eye slits -->
      <rect x="23" y="32" width="7" height="4" rx="1.5" fill="#1b5e20"/>
      <rect x="34" y="32" width="7" height="4" rx="1.5" fill="#1b5e20"/>
      <!-- nose guard -->
      <path d="M30 30h4v14c0 1-.5 2-2 2s-2-1-2-2z" fill="#b0b0b0"/>
      <!-- mouth opening -->
      <path d="M27 48c1.5 2 3 3 5 3s3.5-1 5-3" stroke="#9a9a9a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </svg>

  <script type="module" src="app.js"></script>
</body>
</html>
